name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (e.g. v0.2.0)"
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.name }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            target: aarch64-unknown-linux-gnu
            artifact: roxy-linux
            binary: target/aarch64-unknown-linux-gnu/release/roxy
          - name: windows-x64
            target: x86_64-pc-windows-gnu
            artifact: roxy.exe
            binary: target/x86_64-pc-windows-gnu/release/roxy.exe
    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 \
            gcc-aarch64-linux-gnu \
            libxkbcommon-dev libgl1-mesa-dev libwayland-dev \
            libx11-dev libxcursor-dev libxi-dev libxrandr-dev libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cross-compile
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          fi
          cargo build --release --target "${{ matrix.target }}"

      - name: Upload ${{ matrix.artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          if-no-files-found: error
          retention-days: 7

  # SignPath signs the Windows executable with a certificate it holds on the
  # project's behalf — the key never touches this repository or a developer
  # machine. Skipped automatically until the integration is approved and the
  # SIGNPATH_* secrets exist, so builds keep working in the meantime.
  sign:
    name: sign (SignPath)
    needs: build
    runs-on: ubuntu-24.04
    if: ${{ vars.SIGNPATH_ENABLED == 'true' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: roxy.exe
          path: unsigned

      - name: Submit signing request
        id: signpath
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: roxy
          signing-policy-slug: release-signing
          artifact-configuration-slug: roxy-exe
          github-artifact-id: roxy.exe
          wait-for-completion: true
          output-artifact-directory: signed

      - uses: actions/upload-artifact@v4
        with:
          name: roxy.exe
          path: signed/roxy.exe
          overwrite: true
          retention-days: 7

  publish:
    name: publish release
    needs: [build, sign]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Package and checksum
        run: |
          set -euo pipefail
          cd dist
          chmod +x roxy-linux
          cp ../README.md README.md
          zip -q roxy-windows-x64.zip roxy.exe README.md
          sha256sum roxy-windows-x64.zip roxy.exe roxy-linux > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            dist/roxy.exe
            dist/roxy-windows-x64.zip
            dist/roxy-linux
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
